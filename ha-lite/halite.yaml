# ha-lite Server - Configuration
# Environment variables override these settings (prefix HALITE_).

server:
  host: "0.0.0.0"     # Listen address
  port: 8090           # HTTP port

xiaomi:
  # Xiaomi/Mi account credentials.
  # OPTIONAL: Leave empty to use QR code login (Mi Home app scan).
  # QR login: POST /api/login/qr/start → scan with Mi Home → POST /api/login/qr/collect
  username: ""          # Xiaomi account phone/email (or HALITE_XIAOMI_USERNAME)
  password: ""          # Xiaomi account password (or HALITE_XIAOMI_PASSWORD)
  region: "cn"          # Server region: cn, sg, de, us, ru, tw, in

registry:
  cache_file: "cache/mi_tokens.json"   # Local device token cache

# OAuth 2.0 login (browser-based, no phone needed).
# Uses HA's registered client_id for Xiaomi cloud API access.
oauth:
  enabled: true                                # Enable OAuth login
  client_id: "2882303761520251711"              # Xiaomi OAuth client_id (HA's registered ID)
  callback_port: 8123                          # Local callback server port
  token_cache: "cache/oauth_token.json"        # OAuth token persistence

# Optional: static device entries for fallback (when cloud is unavailable).
# devices:
#   - name: "Living Room Light"
#     did: "12345678"
#     ip: "192.168.1.50"
